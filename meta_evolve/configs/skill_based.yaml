# Skill-based MetaEvolve 配置

# LLM
llm:
  model: "together_ai/moonshotai/Kimi-K2.5"
  max_tokens: 8192

# 内层进化循环
inner_loop:
  n_iterations: 20
  batch_size: 8
  max_pop_size: 30

# 策略默认初始值
strategy:
  exploration_rate: 0.3
  selection_temperature: 1.0
  elite_ratio: 0.2
  mutation_strength: 0.5
  context_size: 3
  diversity_weight: 0.3
  error_analysis: 0.5
  diff_vs_rewrite: 0.3
  show_context_scores: 0.7
  domain_hint: 0.5
  llm_temperature: 0.7
  parent_best_bias: 0.7
  crossover_rate: 0.0

# Skill Meta-Learning
skill_meta:
  n_meta_steps: 10
  tasks_per_step: 3
  n_iterations: 30

# Skill Orchestrator
orchestrator:
  max_active_skills: 3
  selection_trial_iters: 5
  generation_interval_iters: 5
  max_generate_per_window: 1
  batch_size: 8

# 任务划分
tasks:
  train:
    - math/circle_packing
    - math/first_autocorr_ineq
    - math/heilbronn_triangle
    - math/second_autocorr_ineq
    - math/third_autocorr_ineq
  test:
    - math/circle_packing_rect
    - math/erdos_min_overlap
    - math/matmul
    - math/signal_processing
    - math/sums_diffs_finite_sets
    - math/uncertainty_ineq
