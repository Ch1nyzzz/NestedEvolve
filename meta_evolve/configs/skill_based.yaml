# Skill-based MetaEvolve 配置

# LLM
llm:
  model: "together_ai/MiniMaxAI/MiniMax-M2.5"
  max_tokens: 4096

# 内层进化循环
inner_loop:
  n_steps: 20
  max_pop_size: 30
  analyze_interval: 5

# 策略默认初始值
strategy:
  exploration_rate: 0.3
  selection_temperature: 1.0
  elite_ratio: 0.2
  mutation_strength: 0.5
  context_size: 3
  diversity_weight: 0.3
  error_analysis: 0.5
  diff_vs_rewrite: 0.3
  show_context_scores: 0.7
  domain_hint: 0.5
  llm_temperature: 0.7
  max_tokens_ratio: 0.5
  parent_best_bias: 0.7
  crossover_rate: 0.0

# Skill Meta-Learning
skill_meta:
  n_meta_steps: 10
  tasks_per_step: 3
  n_segments: 3
  steps_per_segment: 10
  max_active_skills: 3

# Skill Orchestrator
orchestrator:
  max_active_skills: 3
  selection_interval_steps: 1
  generation_interval_steps: 10
  max_generate_per_window: 1

# 任务划分
tasks:
  train:
    - circle_packing
    - first_autocorr_ineq
    - heilbronn_triangle
    - second_autocorr_ineq
    - third_autocorr_ineq
  test:
    - circle_packing_rect
    - erdos_min_overlap
    - matmul
    - signal_processing
    - sums_diffs_finite_sets
    - uncertainty_ineq
